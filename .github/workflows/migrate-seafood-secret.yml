name: Transfer Shelf Seafood secret

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/migrate-seafood-secret.yml"

permissions:
  contents: read

jobs:
  encrypt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install encryption dependency
        run: pip install pynacl==1.5.0

      - name: Encrypt secret for Shelf Seafood repository
        env:
          SOURCE_GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DESTINATION_PUBLIC_KEY: "8LAwCmO1tu+V0MDOLi4RQLvzWRq140ydiYIPdDDOtCM="
          DESTINATION_KEY_ID: "3380204578043523366"
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          from nacl.public import PublicKey, SealedBox

          value = os.environ.get("SOURCE_GMAIL_APP_PASSWORD", "")
          if not value:
              raise RuntimeError("Source GMAIL_APP_PASSWORD secret is missing")
          public_key = PublicKey(base64.b64decode(os.environ["DESTINATION_PUBLIC_KEY"]))
          encrypted = SealedBox(public_key).encrypt(value.encode("utf-8"))
          payload = {
              "key_id": os.environ["DESTINATION_KEY_ID"],
              "secrets": {
                  "GMAIL_APP_PASSWORD": base64.b64encode(encrypted).decode("ascii")
              },
          }
          with open("secret-transfer.json", "w", encoding="utf-8") as handle:
              json.dump(payload, handle)
          PY

      - name: Upload encrypted transfer package
        uses: actions/upload-artifact@v4
        with:
          name: shelf-seafood-secret-transfer
          path: secret-transfer.json
          retention-days: 1
