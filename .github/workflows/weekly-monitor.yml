name: Weekly Coles product monitor

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/weekly-monitor.yml"
      - "coles_monitor/**"
      - "config.json"
      - "requirements.txt"
      - "run_monitor.py"
  schedule:
    # 06:00 AEST every Wednesday (fixed UTC+10; 07:00 local during AEDT).
    - cron: "0 20 * * 2"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-coles-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Scrape, compare, record and notify
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          COLES_BUILD_ID: ${{ secrets.COLES_BUILD_ID }}
          RETAIL_PROXY_URL: ${{ secrets.RETAIL_PROXY_URL }}
        run: python run_monitor.py ${{ github.event_name == 'push' && '--email-baseline' || '' }}

      - name: Commit updated snapshot and history
        run: |
          if git diff --quiet -- data; then
            echo "No state changes to commit."
            exit 0
          fi
          git config user.name "coles-monitor[bot]"
          git config user.email "coles-monitor[bot]@users.noreply.github.com"
          git add data/current.json data/events.json data/coles-woolworths-sauce-change-history.xlsx
          git commit -m "Update Coles product snapshot"
          git push

      - name: Upload Excel history
        uses: actions/upload-artifact@v4
        with:
          name: coles-woolworths-sauce-change-history
          path: data/coles-woolworths-sauce-change-history.xlsx
          if-no-files-found: error
