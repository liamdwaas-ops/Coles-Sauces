name: Weekly Shelf Seafood product monitor

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/weekly-seafood-monitor.yml"
      - "coles_monitor/**"
      - "config-seafood.json"
      - "requirements.txt"
      - "run_monitor.py"
      - "run_seafood_monitor.py"
      - "tests/**"
      - ".shelf-seafood-baseline-once"
  schedule:
    # 06:00 AEST every Wednesday (fixed UTC+10; 07:00 local during AEDT).
    - cron: "0 20 * * 2"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Share the Sauces monitor's group so simultaneous Wednesday runs serialize.
  group: weekly-coles-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Validate and email initial Shelf Seafood baseline
        if: ${{ hashFiles('.shelf-seafood-baseline-once') != '' }}
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          COLES_BUILD_ID: ${{ secrets.COLES_BUILD_ID }}
        run: python run_seafood_monitor.py --email-baseline

      - name: Commit initial Shelf Seafood baseline
        if: ${{ success() && hashFiles('.shelf-seafood-baseline-once') != '' }}
        run: |
          git config user.name "coles-monitor[bot]"
          git config user.email "coles-monitor[bot]@users.noreply.github.com"
          git add data/shelf-seafood/current.json data/shelf-seafood/events.json data/shelf-seafood/coles-woolworths-shelf-seafood-change-history.xlsx
          git rm .shelf-seafood-baseline-once
          git commit -m "Initialize Shelf Seafood product snapshot"
          git pull --rebase origin main
          git push

      - name: Scrape, compare, record and notify
        if: ${{ github.event_name != 'push' }}
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          COLES_BUILD_ID: ${{ secrets.COLES_BUILD_ID }}
        run: python run_seafood_monitor.py

      - name: Commit updated Shelf Seafood snapshot and history
        if: ${{ github.event_name != 'push' }}
        run: |
          if git diff --quiet -- data/shelf-seafood; then
            echo "No Shelf Seafood state changes to commit."
            exit 0
          fi
          git config user.name "coles-monitor[bot]"
          git config user.email "coles-monitor[bot]@users.noreply.github.com"
          git add data/shelf-seafood/current.json data/shelf-seafood/events.json data/shelf-seafood/coles-woolworths-shelf-seafood-change-history.xlsx
          git commit -m "Update Shelf Seafood product snapshot"
          git pull --rebase origin main
          git push

      - name: Upload Shelf Seafood Excel history
        if: ${{ github.event_name != 'push' }}
        uses: actions/upload-artifact@v4
        with:
          name: coles-woolworths-shelf-seafood-change-history
          path: data/shelf-seafood/coles-woolworths-shelf-seafood-change-history.xlsx
          if-no-files-found: error
